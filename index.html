<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <h1>💰 Expense Tracker</h1>
            <p>Manage your daily expenses</p>
        </div>

        <button id="themeBtn">🌙</button>
    </header>

    <main class="container">

        <!-- Summary -->

        <section class="summary">

            <div class="box">
                <p>Total Spent</p>
                <h2 id="totalSpent">₹0</h2>
            </div>

            <div class="box">
                <p>This Month</p>
                <h2 id="monthlySpent">₹0</h2>
            </div>

            <div class="box">
                <p>Monthly Budget</p>
                <h2>₹10,000</h2>
            </div>

        </section>


        <!-- Add Expense -->

        <section class="card">

            <h2>Add Expense</h2>

            <form id="expenseForm">

                <div>
                    <label>Title</label>
                    <input type="text" id="title" placeholder="Enter title" required>
                </div>

                <div>
                    <label>Amount</label>
                    <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>
                </div>

                <div>
                    <label>Category</label>

                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option>Food</option>
                        <option>Travel</option>
                        <option>Shopping</option>
                        <option>Bills</option>
                        <option>Other</option>
                    </select>
                </div>

                <div>
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>

                <button type="submit" id="submitBtn">Add Expense</button>

            </form>

        </section>


        <!-- Expenses -->

        <section class="card">

            <h2>My Expenses</h2>

            <div class="filters">

                <select id="filterCategory">
                    <option value="All">All Categories</option>
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Bills</option>
                    <option>Other</option>
                </select>

                <select id="sortAmount">
                    <option value="default">Sort By</option>
                    <option value="low">Low to High</option>
                    <option value="high">High to Low</option>
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                </select>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="expenseList"></tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
